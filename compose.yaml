services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gametime
      POSTGRES_PASSWORD: gametime
      POSTGRES_DB: gametime
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametime -d gametime"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
